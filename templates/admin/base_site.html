{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | SpaceFlow Admin{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'admin/css/spaceflow.css' %}?v=20260526-clipmod">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="sf-brand">
        <span class="sf-brand-mark">SF</span>
        <span class="sf-brand-text">
            <strong>SpaceFlow</strong>
            <small>{{ site_header|default:"Admin Console" }}</small>
        </span>
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
